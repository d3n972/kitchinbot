services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchenbot
    ports:
      - "5432:5432"
    volumes:
      - kitchenbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchenbot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  kitchenbot-pgdata:
